name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: --win --x64
          - name: macOS
            os: macos-latest
            target: --mac --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test rich Markdown
        run: npm run test:rich-markdown

      - name: Test document images
        run: npm run test:document-images

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG must match package.json version v$VERSION"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm exec -- electron-vite build

      - name: Package application
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish never

      - name: Upload packaged artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: Velox-${{ matrix.platform.name }}-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
