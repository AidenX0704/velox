name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: --win --x64
          - name: macOS
            os: macos-latest
            target: --mac --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ inputs.tag || github.ref_name }}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG must match package.json version v$VERSION"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build renderer and main process
        run: pnpm exec electron-vite build

      - name: Publish artifacts to GitHub Release
        run: pnpm exec electron-builder ${{ matrix.platform.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
