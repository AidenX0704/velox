name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: --win --x64
          - name: macOS
            os: macos-latest
            target: --mac --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            target: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test rich Markdown
        run: npm run test:rich-markdown

      - name: Test document images
        run: npm run test:document-images

      - name: Test tab close workflow
        run: npm run test:tab-close

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG must match package.json version v$VERSION"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm exec -- electron-vite build

      - name: Package application
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish never

      - name: Upload packaged artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: Velox-${{ matrix.platform.name }}-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish Linux artifacts to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'Linux'
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows release artifacts
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish never

      - name: Publish Windows artifacts to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $version = node -p "require('./package.json').version"
          $installers = @(Get-ChildItem -Path dist -Filter 'Velox-*-setup.exe' -File)
          $metadata = @(Get-ChildItem -Path dist -Filter 'latest.yml' -File)

          if ($tag -ne "v$version") {
            throw "Release tag $tag must match package.json version v$version"
          }

          if ($installers.Count -ne 1 -or $metadata.Count -ne 1) {
            Get-ChildItem -Path dist -File | Format-Table Name, Length
            throw 'Expected exactly one Windows installer and one latest.yml file'
          }

          $installer = $installers[0]
          $blockmap = Get-Item -LiteralPath "$($installer.FullName).blockmap" -ErrorAction SilentlyContinue

          if (-not $blockmap) {
            Get-ChildItem -Path dist -File | Format-Table Name, Length
            throw "Expected blockmap for $($installer.Name)"
          }

          $metadataContent = Get-Content -LiteralPath $metadata[0].FullName -Raw
          if ($metadataContent -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$" -or
              $metadataContent -notmatch [regex]::Escape($installer.Name)) {
            throw 'latest.yml does not reference the packaged Windows version and installer'
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $version `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release $tag"
            }
          }

          gh release upload $tag `
            $installer.FullName `
            $blockmap.FullName `
            $metadata[0].FullName `
            --clobber `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Windows release artifacts for $tag"
          }

          $releaseAssets = @(gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json assets `
            --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify GitHub Release assets for $tag"
          }

          foreach ($expectedAsset in @($installer.Name, $blockmap.Name, $metadata[0].Name)) {
            if ($releaseAssets -notcontains $expectedAsset) {
              throw "GitHub Release $tag is missing Windows asset $expectedAsset"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Package macOS release artifacts
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'macOS'
        run: npm exec -- electron-builder ${{ matrix.platform.target }} --publish never

      - name: Publish macOS artifacts to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'macOS'
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          shopt -s nullglob
          DMGS=(dist/*.dmg)
          ZIPS=(dist/*.zip)
          METADATA=(dist/latest-mac.yml)
          BLOCKMAPS=(dist/*.blockmap)

          if (( ${#DMGS[@]} == 0 || ${#ZIPS[@]} == 0 || ${#METADATA[@]} != 1 )); then
            echo "Expected macOS DMG, ZIP, and latest-mac.yml artifacts"
            ls -la dist
            exit 1
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "${TAG#v}" \
              --generate-notes
          fi

          gh release upload "$TAG" \
            "${DMGS[@]}" \
            "${ZIPS[@]}" \
            "${METADATA[@]}" \
            "${BLOCKMAPS[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
